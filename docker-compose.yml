# Unified Docker Compose
version: "3.8"

services:
  # ---------------------------------------------------------------------
  # 1. OpenClaw Service (Main Gateway)
  # ---------------------------------------------------------------------
  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:latest # Update to exact openclaw image name
    container_name: openclaw-gateway
    restart: unless-stopped
    environment:
      - AGENT_MODEL=${AGENT_MODEL}
      - AUTH_TOKEN=${AUTH_TOKEN}
    ports:
      - "18789:18789"
    volumes:
      - ./openclaw_config:/home/node/.openclaw
      - ./openclaw_workspace:/home/node/openclaw/workspace
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------
  # 2. Backend Service
  # ---------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-app
    restart: unless-stopped
    ports:
      - "8000:8000" # Typically used for backend like Django/FastAPI/Node
    env_file:
      - .env
    volumes:
      # Optional: mount the local folder during dev for hot-reloading
      - ./backend:/app
      # Prevent local mount from overriding container's node_modules
      - /app/node_modules
    depends_on:
      openclaw-gateway:
        condition: service_healthy

  # ---------------------------------------------------------------------
  # 3. Frontend Service
  # ---------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-app
    restart: unless-stopped
    ports:
      - "3000:3000" # Typically used for React/Vue/NextJS
    env_file:
      - .env
    volumes:
      # Optional: mount the local folder during dev for hot-reloading
      - ./frontend:/app
      # Prevent local mount from overriding container's node_modules
      - /app/node_modules
    depends_on:
      - backend
