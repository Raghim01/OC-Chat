# Unified Docker Compose
services:
  # ---------------------------------------------------------------------
  # 1. OpenClaw Service (Main Gateway)
  # ---------------------------------------------------------------------
  openclaw-gateway:
    image: ghcr.io/openclaw/openclaw:latest # Update to exact openclaw image name
    container_name: openclaw-gateway
    restart: unless-stopped
    environment:
      - AUTH_TOKEN=${AUTH_TOKEN}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    ports:
      - "${OPENCLAW_PORT:-18789}:18789"
    volumes:
      - ./openclaw_config:/home/node/.openclaw
      - ./openclaw_workspace:/home/node/openclaw/workspace
    env_file:
      - .env
    healthcheck:
      test:
        ["CMD", "curl", "-f", "http://localhost:${OPENCLAW_PORT:-18789}/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------------
  # 2. Backend Service
  # ---------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-app
    restart: unless-stopped
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    volumes:
      # Optional: mount the local folder during dev for hot-reloading
      - ./backend:/app
      # Prevent local mount from overriding container's node_modules
      - /app/node_modules
      # Docker daemon socket — required for docker-cli to exec into sibling containers
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      openclaw-gateway:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:${PORT:-8000}/health/openclaw || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s

  # ---------------------------------------------------------------------
  # 3. Frontend Service
  # ---------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend-app
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    env_file:
      - .env
    volumes:
      # Optional: mount the local folder during dev for hot-reloading
      - ./frontend:/app
      # Prevent local mount from overriding container's node_modules
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
